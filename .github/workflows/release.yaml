name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    name: Attach the integration
    runs-on: ubuntu-latest
    permissions:
      contents: write # To attach the zip to the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The manifest's version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version custom_components/orca_heatpump/manifest.json)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "manifest.json says $version, the tag is $TAG" >&2
            exit 1
          fi
      - name: Zip the integration for manual installs
        working-directory: custom_components/orca_heatpump
        run: zip -r "$GITHUB_WORKSPACE/orca_heatpump.zip" . -x "*/__pycache__/*"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" orca_heatpump.zip --repo "$GITHUB_REPOSITORY"
