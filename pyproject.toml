# Not a distributable package: this file only configures the tools. The
# integration has no runtime dependencies beyond Home Assistant (ADR 0005).

[dependency-groups]
# Extras on top of Home Assistant's test requirements. The ha-dev container
# installs this group into its venv on start.
dev = ["hypothesis==6.170.1"]
# CI installs homeassistant and pytest-home-assistant per channel (ADR 0011),
# plus this group.
ci = [{ include-group = "dev" }, "mypy==2.4.0", "pytest-cov==7.1.0"]

[tool.pytest.ini_options]
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true
# Known warnings from Home Assistant and its dependencies, as in core's config.
filterwarnings = [
  "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
  "ignore:Setting custom ClientSession.close attribute is discouraged:DeprecationWarning:homeassistant.helpers.aiohttp_client",
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._async",
]

[tool.coverage.run]
source = ["custom_components.orca_heatpump"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components", "tests", "tools"]
strict = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "redundant-self",
  "truthy-iterable",
]

# HA's pytest plugin has no py.typed marker yet; analyse it anyway.
[[tool.mypy.overrides]]
module = ["pytest_homeassistant", "pytest_homeassistant.*"]
follow_untyped_imports = true

# Tests change state through Home Assistant calls that mypy can't follow.
[[tool.mypy.overrides]]
module = ["tests.*"]
warn_unreachable = false
disable_error_code = ["comparison-overlap"]

# Ruff settings follow Home Assistant core (pyproject.toml and tests/ruff.toml
# at 2026.11), minus rules that only concern core's own tree.
[tool.ruff]
required-version = ">=0.17.3"
target-version = "py314"

[tool.ruff.lint]
select = [
  "A001",   # Variable {name} is shadowing a Python builtin
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "BLE",
  "C",      # complexity
  "COM818", # Trailing comma on bare tuple prohibited
  "D",      # docstrings
  "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
  "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
  "DTZ011", # Use datetime.now(tz=).date() instead of date.today()
  "E",      # pycodestyle
  "F",      # pyflakes/autoflake
  "F541",   # f-string without any placeholders
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "ICN001", # import conventions; {name} should be imported as {asname}
  "ICN002", # import conventions; {name} should not be imported as {asname}
  "LOG",    # flake8-logging
  "N804",   # First argument of a class method should be named cls
  "N805",   # First argument of a method should be named self
  "N806",   # Variable {name} in function should be snake_case
  "N815",   # Variable {name} in class scope should not be mixedCase
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules (see `ignore` for exclusions)
  "S102",   # Use of exec detected
  "S103",   # bad-file-permissions
  "S107",   # Possible hardcoded password assigned to function default
  "S108",   # hardcoded-temp-file
  "S301",   # suspicious-pickle-usage
  "S306",   # suspicious-mktemp-usage
  "S307",   # suspicious-eval-usage
  "S313",   # suspicious-xmlc-element-tree-usage
  "S314",   # suspicious-xml-element-tree-usage
  "S315",   # suspicious-xml-expat-reader-usage
  "S316",   # suspicious-xml-expat-builder-usage
  "S317",   # suspicious-xml-sax-usage
  "S318",   # suspicious-xml-mini-dom-usage
  "S319",   # suspicious-xml-pull-dom-usage
  "S601",   # paramiko-call
  "S602",   # subprocess-popen-with-shell-equals-true
  "S604",   # call-with-shell-equals-true
  "S608",   # hardcoded-sql-expression
  "S609",   # unix-command-wildcard-injection
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T100",   # Trace found: {name} used
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID",    # Tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle
]
ignore = [
  "ASYNC109", # Async function definition with a `timeout` parameter
  "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
  "ASYNC240", # Use an async function for entering the file system
  "B008",     # Function call in argument defaults; common in Home Assistant
  "B019",     # functools.cache on methods can lead to memory leaks
  "D202",     # No blank lines allowed after function docstring
  "D203",     # 1 blank line required before class docstring
  "D213",     # Multi-line docstring summary should start at the second line
  "D406",     # Section name should end with a newline
  "D407",     # Section name underlining
  "D417",     # Missing argument descriptions; document only non-obvious parameters
  "E501",     # line too long
  "PLC1901",  # Empty string comparison; too many false positives
  "PLR0911",  # Too many return statements
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PLR0917",  # Too many positional arguments
  "PLR2004",  # Magic value used in comparison
  "PLW0108",  # Unnecessary lambda wrapping a function call
  "PLW1641",  # __eq__ without __hash__
  "PLW2901",  # Outer loop variable overwritten by inner target
  "PT011",    # pytest.raises() is too broad
  "PT018",    # Assertion should be broken down into multiple parts
  "RUF001",   # String contains ambiguous unicode character
  "RUF012",   # Mutable class attributes should be annotated with typing.ClassVar
  "RUF015",   # Prefer next(...) over single element slice
  "RUF043",   # Pattern passed to match= contains unescaped metacharacters
  "SIM102",   # Use a single if statement instead of nested if statements
  "SIM103",   # Return the condition directly
  "SIM108",   # Use ternary operator instead of if-else-block
  "SIM115",   # Use context handler for opening files
  # Moving imports into type-checking blocks can mess with pytest.patch()
  "TC001",
  "TC002",
  "TC003",
  "TC006",    # Add quotes to type expression in typing.cast()
  "TRY003",   # Avoid specifying long messages outside the exception class
  "TRY400",   # Use `logging.exception` instead of `logging.error`
  "UP047",    # Non PEP 696 generic function
  "UP049",    # Avoid private type parameter names
  # May conflict with the formatter
  "W191",
  "E111",
  "E114",
  "E117",
  "D206",
  "D300",
  "Q",
  "COM812",
  "COM819",
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.core.DOMAIN" = "HOMEASSISTANT_DOMAIN"
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.util.dt" = "dt_util"
"homeassistant.util.json" = "json_util"

[tool.ruff.lint.flake8-import-conventions.banned-aliases]
"probatio" = ["vol"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"voluptuous".msg = "use probatio instead"
"httpx".msg = "use httpx2 instead"
"httpcore".msg = "use httpcore2 instead"
"syrupy.SnapshotAssertion".msg = "use syrupy.assertion.SnapshotAssertion instead"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "tests"]
known-third-party = ["pytest", "syrupy", "probatio"]
forced-separate = ["tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Standalone command-line scripts, not a package.
"tools/**" = ["INP001", "T201"]
"tests/**" = [
  "B904",   # Use raise from to specify exception cause
  "N806",   # Variable {name} in function should be snake_case
  "N815",   # Variable {name} in class scope should not be mixedCase
  "RUF018", # Avoid assignment expressions in assert statements
  "S107",   # Possible hardcoded password assigned to function default
  "SLF001", # Tests access internals
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]

[tool.codespell]
ignore-words-list = "hass,sistem"
