rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions of its own.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      No requirements (ADR 0005). The display's protocol client is part of
      the integration (client/), imports nothing from Home Assistant and has
      its own tests.
  docs-actions:
    status: exempt
    comment: The integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      The display announces nothing on the network and its API exposes no MAC
      or hostname. Only a DHCP match on Carel's MAC prefix 00:0A:5C is possible;
      it also matches other Carel equipment, and only a login could tell them
      apart. Decided with the user: the display keeps a fixed address (ADR 0013).
  discovery-update-info:
    status: exempt
    comment: >-
      No discovery (ADR 0013). The README asks for a fixed address, and the
      reconfigure flow changes the host.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      One physical pump whose sub-devices are its fixed parts. They only change
      when an installer rewires the pump: the next setup detects that and raises
      a repair issue, and confirming it reloads with the new parts and removes
      the old devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
