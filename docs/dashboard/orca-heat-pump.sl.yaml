  - type: grid
    cards:
    - type: heading
      heading: Toplotna črpalka
      icon: mdi:heat-pump-outline
    - type: gauge
      entity: sensor.heat_pump_outdoor_unit_power
      name: Moč
      min: 0
      max: 100
      needle: true
      segments:
      - from: 0
        color: var(--success-color)
      - from: 60
        color: var(--warning-color)
      - from: 85
        color: var(--error-color)
      grid_options:
        columns: 6
        rows: 3
    - type: gauge
      entity: sensor.heat_pump_temperature
      name: Temperatura
      min: 10
      max: 60
      needle: true
      segments:
      - from: 10
        color: '#42a5f5'
      - from: 25
        color: var(--success-color)
      - from: 45
        color: '#ff7043'
      grid_options:
        columns: 6
        rows: 3
    - type: tile
      entity: sensor.heat_pump_outdoor_temperature
      name:
        type: entity
      features:
      - type: trend-graph
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.heat_pump_temperature
      name:
        type: entity
      features:
