# Orca heat pump dashboard: built-in cards only, nothing to install.
#
# Settings > Dashboards > Add dashboard > New dashboard from scratch, then open it,
# choose Edit > Raw configuration editor and paste this file.
#
# Made for a pump with an "Underfloor heating" and a "Radiators" circuit, hot water
# and solar. Circuits are named after their name on your display: replace
# "underfloor_heating" and "radiators" with yours (see their entity IDs), and delete
# the parts your pump doesn't have. The headings are plain text; entity names follow
# your Home Assistant's language.
#
# Generated by tools/build_dashboard.py; change that, not this file.
title: Toplotna črpalka
