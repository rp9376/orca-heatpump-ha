- title: Trendi
  path: trends
  icon: mdi:chart-line
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: history-graph
      title: Temperature, zadnjih 24 ur
      hours_to_show: 24
      entities:
      - sensor.heat_pump_outdoor_temperature
      - sensor.heat_pump_temperature
      - sensor.underfloor_heating_flow_temperature
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: history-graph
      title: Sanitarna voda, zadnji 3 dnevi
      hours_to_show: 72
      entities:
      - sensor.hot_water_top_temperature
      - sensor.hot_water_bottom_temperature
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: history-graph
      title: Moč zunanje enote, zadnjih 24 ur
      hours_to_show: 24
      entities:
      - sensor.heat_pump_outdoor_unit_power
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: statistics-graph
      title: Zunanja temperatura, zadnji mesec
      entities:
      - sensor.heat_pump_outdoor_temperature
      days_to_show: 30
      period: day
      stat_types:
      - min
      - mean
      - max
      grid_options:
        columns: full
    - type: logbook
      title: Zgodovina alarmov
      hours_to_show: 720
      target:
        entity_id:
        - sensor.heat_pump_active_alarm
        - event.heat_pump_alarm
      grid_options:
        columns: full
